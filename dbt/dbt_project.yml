name: chicago_311
version: '1.0.0'
config-version: 2

profile: chicago_311

model-paths:
  - models

clean-targets:
  - target
  - dbt_packages

# Models must land in the pre-created schemas, not SILVER_GOLD.
models:
  chicago_311:
    silver:
      +schema: SILVER
    gold:
      +schema: GOLD
# Reference data loaded into Snowflake GOLD
seed-paths:
  - seeds

seeds:
  chicago_311:
    +schema: GOLD
    community_areas:
      +column_types:
        community_area: integer
        community_area_name: varchar(100)